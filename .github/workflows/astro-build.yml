name: Astro Build

# Baut die Astro-Site bei jedem Push und Pull-Request als CI-Check.
# Deployment auf GitHub Pages folgt in PR 2 (separate Workflow-Datei),
# sobald die bestehenden HTML-Seiten in Astro-Seiten überführt sind und
# die Pages-Source im Repo-Setting auf "GitHub Actions" umgestellt ist.

on:
  push:
    branches: [main, astro-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro site
        run: bun run build

      - name: Upload build artifact (for review)
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist
          retention-days: 7
